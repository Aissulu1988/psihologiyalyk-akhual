<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Бір шаңырақ астында</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#031a35}
body{font-family:Georgia,"Palatino Linotype","Book Antiqua","Times New Roman",serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}

/* ---------- сцена 16:9 (1920×1080), масштабируется под окно ---------- */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform-origin:center center;transform:translate(-50%,-50%) scale(var(--k,1));background:#0a4a94}
#stage>*{position:absolute}

/* ---------- фон ---------- */
#base{inset:0;z-index:1;background:
  radial-gradient(ellipse 70% 60% at 50% 42%,rgba(255,244,214,.22),transparent 70%),
  radial-gradient(ellipse at 18% 12%,rgba(244,201,93,.20),transparent 50%),
  radial-gradient(ellipse at 86% 92%,rgba(244,201,93,.14),transparent 55%),
  linear-gradient(160deg,#17aaa7 0%,#0e82a4 40%,#0a4a94 100%)}
#base>*{position:absolute}
.bgRing{left:360px;top:-60px;width:1200px;height:1200px;opacity:.14;will-change:transform;
  animation:spin 180s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bgRing svg{width:100%;height:100%}
#baseBorder,#msgBorder,#finalBorder{inset:0;pointer-events:none}
#baseBorder{opacity:.5}#msgBorder{opacity:.75}#finalBorder{opacity:.6}
#baseBorder svg,#msgBorder svg,#finalBorder svg{position:absolute;left:0;top:0;width:1920px;height:1080px}

.amb{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff4c0,rgba(255,206,100,0) 70%);
  opacity:0;animation:amb var(--t,12s) linear var(--dl,0s) infinite}
@keyframes amb{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}85%{opacity:.7}
  100%{opacity:0;transform:translate(var(--dx,20px),-170px)}}
#msg:not(.on) .amb,#final:not(.on) .amb{animation-play-state:paused}

/* ---------- сцена 1: приветствие ---------- */
#greet{inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:38px;opacity:0;pointer-events:none}
#greet.in{animation:greetIn 1.3s ease-out .2s both}
#greet.out{animation:greetOut 1.4s ease-in forwards}
@keyframes greetIn{from{opacity:0;filter:blur(16px);transform:scale(.92)}to{opacity:1;filter:blur(0);transform:scale(1)}}
@keyframes greetOut{from{opacity:1;filter:blur(0);transform:scale(1)}to{opacity:0;filter:blur(12px);transform:scale(1.06)}}
#greet h1{font-size:106px;font-weight:700;letter-spacing:.02em;white-space:nowrap;color:#fff3d2;
  text-shadow:0 0 26px rgba(255,214,110,.8),0 0 70px rgba(255,200,90,.42),0 4px 12px rgba(0,40,80,.5)}
.flo{width:720px;height:60px}

/* ---------- сцена 2–3: мозаика ---------- */
#mosaic{inset:0;z-index:3;opacity:0;transition:opacity 1s ease}
#mosaic.show{opacity:1}
#mosaic.fade{opacity:0;transition-duration:1.8s;pointer-events:none}
#mosaic svg{position:absolute;left:0;top:0;width:1920px;height:1080px}
#mosaic .pin{opacity:0;transform-box:view-box;transform-origin:var(--ox) var(--oy)}
#mosaic.show .pin{animation:pieceIn .95s cubic-bezier(.2,.8,.2,1) both}
@keyframes pieceIn{from{opacity:0;transform:scale(.5) rotate(-4deg)}to{opacity:1;transform:none}}
.piece{cursor:pointer;outline:none;transform-box:view-box;transform-origin:var(--ox) var(--oy);
  transition:transform .3s ease,filter .3s ease,opacity .5s ease}
@media (hover:hover){
  .piece:hover{transform:scale(1.07);filter:drop-shadow(0 0 16px rgba(255,214,102,.95))}
}
.piece.used{pointer-events:none}
.piece.selected{transform:scale(1.5);filter:drop-shadow(0 0 30px rgba(255,222,130,1));
  transition:transform .4s cubic-bezier(.2,.8,.2,1),filter .4s ease,opacity .5s ease}
.piece.gone{opacity:0;transform:scale(1.8);filter:drop-shadow(0 0 40px rgba(255,222,130,0)) blur(8px)}

/* ---------- небо, облака (общее) ---------- */
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#073f86 0%,#1272c4 38%,#2f9be0 68%,#8bd0f1 100%)}
.sun{position:absolute;inset:0;background:
  radial-gradient(circle at 80% 14%,rgba(255,246,200,.95) 0,rgba(255,226,140,.55) 9%,rgba(255,214,120,.18) 24%,transparent 46%),
  radial-gradient(ellipse 60% 40% at 50% 100%,rgba(255,236,180,.38),transparent 70%)}
#msg .sun{background:
  radial-gradient(circle at 50% 8%,rgba(255,246,200,.85) 0,rgba(255,226,140,.45) 10%,rgba(255,214,120,.14) 28%,transparent 52%),
  radial-gradient(ellipse 60% 40% at 50% 100%,rgba(255,236,180,.38),transparent 70%)}
#final.go .sun{animation:sunPulse 7s ease-in-out infinite alternate}
@keyframes sunPulse{from{opacity:.82}to{opacity:1}}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 160deg at 80% 14%,rgba(255,244,200,.10) 0 3deg,transparent 3deg 9deg);
  -webkit-mask-image:radial-gradient(circle at 80% 14%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 80% 14%,#000 0,transparent 70%)}
.cw{position:absolute}
.cloud{width:100%;height:100%;will-change:transform;animation:drift var(--dur,50s) ease-in-out infinite alternate;animation-play-state:paused;background:
  radial-gradient(ellipse 26% 44% at 24% 64%,rgba(255,255,255,.96) 0%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 100%),
  radial-gradient(ellipse 28% 58% at 44% 44%,rgba(255,255,255,.96) 0%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 100%),
  radial-gradient(ellipse 30% 62% at 64% 46%,rgba(255,255,255,.96) 0%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 100%),
  radial-gradient(ellipse 24% 44% at 80% 64%,rgba(255,255,255,.96) 0%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 100%),
  radial-gradient(ellipse 48% 30% at 50% 78%,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 100%);opacity:.92}
#msg.on .cloud,#final.go .cloud{animation-play-state:running}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(var(--tx,140px))}}

/* ---------- сцена 3: послание ---------- */
#msg{inset:0;z-index:6;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .5s ease,visibility 0s linear .5s}
#msg.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s ease}
#msg .veil{position:absolute;left:210px;top:230px;width:1500px;height:620px;
  background:radial-gradient(ellipse at center,rgba(4,36,82,.5),transparent 68%)}
#msgText{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 180px;text-align:center;
  font-size:88px;line-height:1.22;font-weight:700;color:#fffaf0;text-wrap:balance;
  text-shadow:0 4px 18px rgba(3,30,70,.85),0 0 40px rgba(255,214,110,.35)}
#msg.on #msgText{animation:msgIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(-44%) scale(.94);filter:blur(8px)}
  to{opacity:1;transform:translateY(-50%) scale(1);filter:blur(0)}}
#msg .flo{position:absolute;left:600px}
#msg .f1{top:250px}#msg .f2{top:770px}

/* ---------- сцена 4: шаңырақ ---------- */
#final{inset:0;z-index:7;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity 2s ease,visibility 0s linear 2s}
#final.on{opacity:1;visibility:visible;transition:opacity 2s ease}
#final.leaving{transition:opacity .9s ease,visibility 0s linear .9s}
#final>*{position:absolute}
#sh{left:420px;top:0;width:1080px;height:1080px;overflow:visible}
#sh .uyk,#sh #core,#sh #uykLayer{transform-box:view-box;transform-origin:0px 0px}
#sh #core{opacity:0}
#final.go #core{animation:coreIn 1.9s cubic-bezier(.2,.7,.2,1) 1.6s both}
@keyframes coreIn{from{opacity:0;transform:scale(.3) rotate(-25deg)}to{opacity:1;transform:none}}
#sh .uyk{opacity:0}
#final.go .uyk{animation:uykIn 1.5s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(3s + var(--dl))}
@keyframes uykIn{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:none}}
#final.go #uykLayer{animation:fanOut 2.8s cubic-bezier(.2,.7,.25,1) 3s both}
@keyframes fanOut{from{transform:rotate(-38deg)}to{transform:none}}
#wave{left:210px;top:-210px;width:1500px;height:1500px;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,236,170,0) 38%,rgba(255,230,150,0) 42%,rgba(255,232,160,.8) 49%,rgba(255,240,190,0) 58%)}
#final.go #wave{animation:wave 2.6s ease-out 5.3s both}
@keyframes wave{0%{opacity:0;transform:scale(.15)}25%{opacity:1}100%{opacity:0;transform:scale(2.3)}}
#finalText{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;opacity:0;z-index:3;isolation:isolate;
  font-size:62px;line-height:1.28;font-weight:700;color:#fff2cc;letter-spacing:.01em;
  text-shadow:0 3px 14px rgba(3,28,66,.9),0 0 34px rgba(255,214,110,.45)}
#finalText::before{content:"";position:absolute;left:50%;top:50%;width:1500px;height:420px;margin:-210px 0 0 -750px;z-index:-1;
  background:radial-gradient(ellipse at center,rgba(4,34,78,.62) 0,rgba(4,34,78,.42) 40%,transparent 70%)}
#finalText span{display:block}
#final.go #finalText{animation:textIn 1.9s ease-out 6.3s both}
@keyframes textIn{from{opacity:0;transform:translateY(-50%) scale(.9)}to{opacity:1;transform:translateY(-50%) scale(1)}}
#again{left:50%;bottom:34px;transform:translateX(-50%);z-index:5;padding:10px 34px;font:600 26px Georgia,"Times New Roman",serif;
  letter-spacing:.04em;color:#fff2cc;background:rgba(6,40,86,.35);border:1.5px solid rgba(244,201,93,.7);border-radius:40px;
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.2s ease,background .3s ease;outline:none}
#again.ready{opacity:.7;pointer-events:auto}
#again.ready:hover{opacity:1;background:rgba(6,40,86,.6)}

/* ---------- частицы ---------- */
#fx{inset:0;z-index:9;pointer-events:none}
.spark{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;
  background:radial-gradient(circle,#fff8d0 0%,#ffd56b 45%,rgba(255,200,80,0) 72%);opacity:0;
  animation:spark var(--t,1.6s) ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(1)}15%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}

@media (prefers-reduced-motion:reduce){.amb,.cloud,.bgRing,#final.go .sun{animation:none!important}}
</style>
</head>
<body>

<!-- общие орнаментальные элементы -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="bUnit">
    <g fill="none" stroke="#f6d98b" stroke-width="3" stroke-linecap="round">
      <path d="M3,12 C3,-2 14,-12 24,-6 C32,-1 28,12 20,10 C14,9 15,2 20,3"/>
      <path d="M-3,12 C-3,-2 -14,-12 -24,-6 C-32,-1 -28,12 -20,10 C-14,9 -15,2 -20,3"/>
    </g>
    <path d="M0,-18 L5,-12 L0,-6 L-5,-12Z" fill="#f6d98b"/>
  </g>
  <g id="bCorner">
    <g fill="none" stroke="#f6d98b" stroke-width="3" stroke-linecap="round">
      <path d="M0,70 A70,70 0 0 0 70,0"/>
      <path d="M0,104 A104,104 0 0 0 104,0" opacity=".7"/>
      <path d="M0,138 A138,138 0 0 0 138,0" opacity=".45"/>
    </g>
    <path d="M52,40 L64,52 L52,64 L40,52Z" fill="#f6d98b"/>
    <circle cx="52" cy="52" r="3.5" fill="#073f86"/>
  </g>
</defs></svg>

<div id="stage">
  <div id="base"><div class="bgRing" id="bgRing"></div><div id="baseBorder"></div></div>
  <div id="mosaic"></div>

  <div id="greet">
    <div class="flo" data-flo></div>
    <h1>Бүгінгі өз тілегіңді таңда!</h1>
    <div class="flo" data-flo></div>
  </div>

  <div id="msg">
    <div class="sky"></div><div class="sun"></div>
    <div id="msgClouds"></div><div id="msgAmb"></div>
    <div id="msgBorder"></div>
    <div class="veil"></div>
    <div class="flo f1" data-flo></div>
    <div class="flo f2" data-flo></div>
    <div id="msgText"></div>
  </div>

  <div id="final">
    <div class="sky"></div><div class="sun"></div><div class="rays"></div>
    <div id="finalClouds"></div><div id="finalAmb"></div>
    <div id="finalBorder"></div>
    <svg id="sh" viewBox="0 0 1080 1080" width="1080" height="1080"></svg>
    <div id="wave"></div>
    <div id="finalText"><span>Бір шаңырақ астында — бір мақсат, </span><span>бірлікпен — биік белес!</span></div>
    <button id="again" type="button">Қайта бастау</button>
  </div>

  <div id="fx"></div>
</div>

<script>
(function(){
'use strict';

/* ================= настройки ================= */
var GREET_MS = 3000;   // через сколько после появления приветствие начинает растворяться
var MSG_MS   = 3500;   // время показа послания

var MSGS = [
 'Сенің қолыңнан бәрі келеді!','Білімің — болашағыңның шамшырағы!','Бүгін жаңа нәрсе үйренуге мүмкіндік бар!',
 'Үлкен жетістік кішкентай қадамнан басталады!','Ана тіліңді құрметте, тарихыңды таны!','Бірлік бар жерде — тірлік бар!',
 'Үлкенді сыйла, кішіні құрметте!','Еңбек түбі — береке!','Өзіңе сен, мақсатыңа ұмтыл!','Әр адамның ойы құнды!',
 'Батыл сұрақ қой, ізденуден қорықпа!','Жақсылық жасаудан жалықпа!','Тамырыңды таны, болашағыңды жаса!',
 'Білімді ұрпақ — ел болашағы!','Сыйластық — татулықтың бастауы!','Талабың таудай болсын!',
 'Бүгінгі талпынысың — ертеңгі жеңісің!','Өзгеге құрмет — өзіңе құрмет!','Бір-бірімізді қолдап, бірге өсейік!',
 'Жаңа ойға ашық бол!','Ұлттық құндылық — ұрпаққа аманат!','Арманың асқақ, қадамың нық болсын!',
 'Ынтымақ пен білім бізді биікке жетелейді!','Әр күнің жаңа мүмкіндікке толы болсын!',
 'Достық пен адалдық — ең үлкен байлық!','Ұстазыңды сыйла, білімге құштар бол!',
 'Қиындықтан қорықпа, ол сені шыңдайды!','Адалдық — адамгершіліктің негізі!',
 'Мейірімді жүрек — ең үлкен қазына!','Отанды сүю — отбасынан басталады!'
];

/* ================= утилиты ================= */
var $ = function(s){return document.querySelector(s)};
var stage=$('#stage'), mosaic=$('#mosaic'), greet=$('#greet'), msg=$('#msg'), msgText=$('#msgText'),
    finalEl=$('#final'), btn=$('#again'), fx=$('#fx');

function fit(){stage.style.setProperty('--k',Math.min(innerWidth/1920,innerHeight/1080))}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();

var timers=[];
function later(f,ms){var id=setTimeout(f,ms);timers.push(id);return id}
function clearAll(){timers.forEach(clearTimeout);timers=[]}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= декор: орнаментальная рамка, завитки, облака, пыль ================= */
function borderSVG(){
  var s='<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><rect x="26" y="26" width="1868" height="1028" rx="10" fill="none" stroke="rgba(255,228,150,.5)" stroke-width="2"/>';
  var x,y;
  for(x=150;x<=1770;x+=90){
    s+='<use href="#bUnit" x="'+x+'" y="52"/><use href="#bUnit" x="'+x+'" y="1028" transform="rotate(180 '+x+' 1028)"/>';
  }
  for(y=150;y<=930;y+=90){
    s+='<use href="#bUnit" x="52" y="'+y+'" transform="rotate(-90 52 '+y+')"/><use href="#bUnit" x="1868" y="'+y+'" transform="rotate(90 1868 '+y+')"/>';
  }
  s+='<g transform="translate(26 26)"><use href="#bCorner"/></g>'+
     '<g transform="translate(1894 26) scale(-1 1)"><use href="#bCorner"/></g>'+
     '<g transform="translate(26 1054) scale(1 -1)"><use href="#bCorner"/></g>'+
     '<g transform="translate(1894 1054) scale(-1 -1)"><use href="#bCorner"/></g></svg>';
  return s;
}
function flourishSVG(){
  var horn='<path d="M-62,0 C-62,-16 -44,-24 -32,-15 C-24,-8 -31,5 -39,0"/>';
  return '<svg viewBox="-360 -30 720 60" width="720" height="60"><g stroke="#f6d98b" fill="none" stroke-width="3" stroke-linecap="round">'+
    '<path d="M-340,0 L-70,0"/><path d="M340,0 L70,0"/>'+horn+'<g transform="scale(-1 1)">'+horn+'</g></g>'+
    '<path d="M0,-15 L11,0 L0,15 L-11,0Z" fill="#f6d98b"/><circle cx="-120" cy="0" r="4" fill="#f6d98b"/><circle cx="120" cy="0" r="4" fill="#f6d98b"/></svg>';
}
function ringSVG(){
  var s='<svg viewBox="-600 -600 1200 1200"><g fill="none" stroke="#f6d98b" stroke-width="2"><circle r="470"/><circle r="580" stroke-dasharray="3 10"/></g>';
  for(var i=0;i<24;i++){s+='<g transform="rotate('+(i*15)+') translate(0 -520)"><use href="#bUnit" transform="scale(1.9)"/></g>'}
  return s+'</svg>';
}
function ambient(el,n){
  for(var i=0;i<n;i++){
    var s=document.createElement('i'),z=3+Math.random()*7;
    s.className='amb';
    s.style.cssText='left:'+(Math.random()*1920)+'px;top:'+(Math.random()*1080)+'px;width:'+z+'px;height:'+z+'px;--t:'+(9+Math.random()*9)+'s;--dl:'+(-Math.random()*14)+'s;--dx:'+((Math.random()-.5)*80)+'px';
    el.appendChild(s);
  }
}
function clouds(el,list){
  el.innerHTML=list.map(function(c){
    return '<div class="cw" style="left:'+c[0]+'px;top:'+c[1]+'px;width:'+c[2]+'px;height:'+(c[2]*.36)+'px"><div class="cloud" style="--dur:'+c[3]+'s;--tx:'+c[4]+'px"></div></div>';
  }).join('');
}

/* ================= частицы ================= */
function spark(x,y,dx,dy,size,t){
  var s=document.createElement('i');s.className='spark';
  s.style.cssText='left:'+x+'px;top:'+y+'px;--s:'+size+'px;--dx:'+dx+'px;--dy:'+dy+'px;--t:'+t+'s';
  s.addEventListener('animationend',function(){s.remove()});
  fx.appendChild(s);
}
function burst(x,y,n,R){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283,d=R*(.3+Math.random()*.9);
    spark(x,y,Math.cos(a)*d,Math.sin(a)*d-40-Math.random()*70,5+Math.random()*11,1.3+Math.random()*1.2);
  }
}

/* ================= мозаика ================= */
var COLS=6,ROWS=4,CW=260,CH=210,OX=180,OY=120,TS=180,TOTAL=COLS*ROWS;
var PAL=[
 {bg:'#17a8a6',a:'#fff3d3',b:'#0b4d78',c:'#f4c75a'},
 {bg:'#124f9d',a:'#9ee4df',b:'#f6d97c',c:'#fff4db'},
 {bg:'#fbf0d6',a:'#0e5a8f',b:'#20a8a4',c:'#d9a33a'},
 {bg:'#e9b64f',a:'#0c3c6d',b:'#fff2d2',c:'#1b9e9f'}
];

/* ---- орнаменты (рисуются в области примерно ±112 × ±86) ---- */
function motif(m,p){
  var A=p.a,B=p.b,C=p.c,s='',k;
  switch(m){
  case 0:{ /* қошқар мүйіз */
    var h='M6,40 C4,2 40,-34 70,-16 C96,0 82,42 56,36 C38,32 40,10 54,12';
    var horn='<path d="'+h+'" stroke="'+A+'" stroke-width="11"/><path d="'+h+'" stroke="'+B+'" stroke-width="3"/><circle cx="54" cy="12" r="6.5" fill="'+C+'" stroke="none"/>';
    var pair=horn+'<g transform="scale(-1 1)">'+horn+'</g>';
    return '<g fill="none" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 -10)">'+pair+'</g>'+
      '<g transform="translate(0 66) scale(.4 -.4)">'+pair+'</g>'+
      '<circle cx="0" cy="28" r="10" fill="'+C+'" stroke="'+A+'" stroke-width="3"/>'+
      '<path d="M0,-84 L11,-68 L0,-52 L-11,-68Z" fill="'+C+'" stroke="'+A+'" stroke-width="3"/></g>';
  }
  case 1:{ /* тұмарша */
    for(k=-1;k<=1;k++){s+='<path d="M'+(k*38)+',44 L'+(k*38)+',64" stroke="'+A+'" stroke-width="4"/><circle cx="'+(k*38)+'" cy="70" r="6" fill="'+C+'" stroke="'+A+'" stroke-width="3"/>'}
    var side=function(x){return '<g transform="translate('+x+' 14) scale(.55)"><polygon points="0,-60 52,36 -52,36" fill="'+C+'" stroke="'+A+'" stroke-width="7"/><circle cx="0" cy="6" r="9" fill="'+B+'"/></g>'};
    return '<g stroke-linejoin="round" stroke-linecap="round">'+side(-88)+side(88)+s+
      '<polygon points="0,-64 56,36 -56,36" fill="'+B+'" stroke="'+A+'" stroke-width="9"/>'+
      '<polygon points="0,-34 32,20 -32,20" fill="'+C+'" stroke="'+A+'" stroke-width="4"/>'+
      '<circle cx="0" cy="-2" r="10" fill="'+A+'" stroke="'+B+'" stroke-width="3"/>'+
      '<circle cx="0" cy="-76" r="8" fill="none" stroke="'+A+'" stroke-width="5"/></g>';
  }
  case 2:{ /* ромбы */
    [[56,-41],[56,41],[-56,-41],[-56,41]].forEach(function(q){s+='<path d="M'+q[0]+','+(q[1]-9)+' L'+(q[0]+9)+','+q[1]+' L'+q[0]+','+(q[1]+9)+' L'+(q[0]-9)+','+q[1]+'Z" fill="'+C+'"/>'});
    return '<g stroke-linejoin="round"><polygon points="0,-82 108,0 0,82 -108,0" fill="none" stroke="'+A+'" stroke-width="6"/>'+
      '<polygon points="0,-60 78,0 0,60 -78,0" fill="'+B+'" stroke="'+C+'" stroke-width="4"/>'+
      '<polygon points="0,-36 46,0 0,36 -46,0" fill="'+A+'" stroke="'+B+'" stroke-width="3"/>'+
      '<polygon points="0,-16 20,0 0,16 -20,0" fill="'+C+'"/>'+s+
      '<path d="M0,-82 V-60 M0,82 V60 M108,0 H78 M-108,0 H-78" stroke="'+C+'" stroke-width="4"/></g>';
  }
  case 3:{ /* розетка */
    for(k=0;k<8;k++){s+='<path d="M0,-12 C9,-22 9,-40 0,-54 C-9,-40 -9,-22 0,-12Z" transform="rotate('+(k*45+22.5)+')" fill="'+C+'" stroke="'+A+'" stroke-width="2.5"/>'}
    for(k=0;k<8;k++){s+='<path d="M0,-10 C17,-28 17,-60 0,-82 C-17,-60 -17,-28 0,-10Z" transform="rotate('+(k*45)+')" fill="'+B+'" stroke="'+A+'" stroke-width="4"/>'}
    return '<g stroke-linejoin="round">'+s+'<circle r="19" fill="'+A+'" stroke="'+C+'" stroke-width="4"/><circle r="8" fill="'+C+'"/></g>';

    var side2='<path d="'+sp+'" fill="none" stroke="'+A+'" stroke-width="9" stroke-linecap="round"/><path d="'+sp+'" fill="none" stroke="'+B+'" stroke-width="2.5" stroke-linecap="round"/>'+

/* ---- контур детали пазла ---- */
function seg(x0,y0,x1,y1,sg){
  if(!sg)return 'L'+x1+','+y1;
  var dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=uy,ny=-ux;
  function P(fx,fy){var u=L/2+(fx-.5)*TS,v=fy*TS*sg;return (x0+ux*u+nx*v).toFixed(1)+','+(y0+uy*u+ny*v).toFixed(1)}
  return 'L'+P(.4,0)+
    'C'+P(.42,0)+' '+P(.43,.04)+' '+P(.42,.08)+
    'C'+P(.41,.12)+' '+P(.33,.13)+' '+P(.34,.19)+
    'C'+P(.35,.26)+' '+P(.65,.26)+' '+P(.66,.19)+
    'C'+P(.67,.13)+' '+P(.59,.12)+' '+P(.58,.08)+
    'C'+P(.57,.04)+' '+P(.58,0)+' '+P(.6,0)+
    'L'+x1+','+y1;
}

var pieces=[],centers=[],used=[],msvg,dim;

function buildMosaic(){
  var rnd=mulberry32(77031),H=[],V=[],r,c,i;
  for(r=0;r<=ROWS;r++){H[r]=[];for(c=0;c<COLS;c++)H[r][c]=(r===0||r===ROWS)?0:(rnd()<.5?1:-1)}
  for(r=0;r<ROWS;r++){V[r]=[];for(c=0;c<=COLS;c++)V[r][c]=(c===0||c===COLS)?0:(rnd()<.5?1:-1)}

  var defs='<radialGradient id="shadeG" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#001a33" stop-opacity=".26"/></radialGradient>';
  PAL.forEach(function(p,k){
    defs+='<pattern id="pt'+k+'" patternUnits="userSpaceOnUse" x="'+OX+'" y="'+OY+'" width="52" height="42">'+
      '<path d="M26,8 L40,21 L26,34 L12,21Z" fill="none" stroke="'+p.c+'" stroke-opacity=".45" stroke-width="1.6"/>'+
      '<circle cx="26" cy="21" r="2.2" fill="'+p.c+'" fill-opacity=".5"/></pattern>';
  });

  var ghosts='',pcs='';
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    i=r*COLS+c;
    var x0=OX+c*CW,y0=OY+r*CH,x1=x0+CW,y1=y0+CH,cx=x0+CW/2,cy=y0+CH/2;
    var d='M'+x0+','+y0+seg(x0,y0,x1,y0,-H[r][c])+seg(x1,y0,x1,y1,V[r][c+1])+seg(x1,y1,x0,y1,H[r+1][c])+seg(x0,y1,x0,y0,-V[r][c])+'Z';
    centers[i]=[cx,cy];used[i]=false;
    var m=(c+2*r)%6,k=(m+r)%4,v=(c+r)%2,p=PAL[k];
    if(v)p={bg:p.bg,a:p.b,b:p.a,c:p.c};
    var corners='';
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(q){
      corners+='<g transform="translate('+(q[0]*104)+' '+(q[1]*81)+')"><path d="M0,-11 C6,-5 6,5 0,11 C-6,5 -6,-5 0,-11Z M-11,0 C-5,-6 5,-6 11,0 C5,6 -5,6 -11,0Z" fill="'+p.c+'" opacity=".9"/><circle r="3" fill="'+p.a+'"/></g>';
    });
    var dl=(Math.hypot(c-2.5,(r-1.5)*1.2)*.16+Math.random()*.15).toFixed(2);
    defs+='<clipPath id="cp'+i+'"><path d="'+d+'"/></clipPath>';
    ghosts+='<path d="'+d+'" fill="rgba(255,255,255,.04)" stroke="rgba(255,230,160,.35)" stroke-width="2" stroke-dasharray="8 8"/>';
    pcs+='<g class="piece" data-i="'+i+'" role="button" tabindex="0" aria-label="Орнамент '+(i+1)+'" style="--ox:'+cx+'px;--oy:'+cy+'px">'+
      '<g class="pin" style="animation-delay:'+dl+'s">'+
      '<path d="'+d+'" fill="'+p.bg+'"/><path d="'+d+'" fill="url(#pt'+k+')"/><path d="'+d+'" fill="url(#shadeG)"/>'+
      '<g clip-path="url(#cp'+i+')"><circle cx="'+cx+'" cy="'+cy+'" r="104" fill="'+p.c+'" opacity=".16"/>'+
      '<g transform="translate('+cx+' '+cy+')"><g transform="scale(.7)">'+motif(m,p)+'</g>'+corners+'</g></g>'+
      '<path d="'+d+'" fill="none" stroke="rgba(2,36,66,.5)" stroke-width="8" stroke-linejoin="round"/>'+
      '<path d="'+d+'" fill="none" stroke="#f7dc8e" stroke-width="3.2" stroke-linejoin="round"/>'+
      '</g></g>';
  }
  mosaic.innerHTML='<svg id="msvg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>'+defs+'</defs>'+
    '<rect x="'+(OX-16)+'" y="'+(OY-16)+'" width="'+(COLS*CW+32)+'" height="'+(ROWS*CH+32)+'" rx="22" fill="rgba(5,38,80,.55)" stroke="rgba(244,201,93,.55)" stroke-width="3"/>'+
    ghosts+pcs+
    '<rect id="dim" x="0" y="0" width="1920" height="1080" fill="#031a38" opacity="0" style="pointer-events:none;transition:opacity .4s ease"/></svg>';
  msvg=$('#msvg');dim=$('#dim');
  pieces=Array.prototype.slice.call(msvg.querySelectorAll('.piece'));

  msvg.addEventListener('pointerover',function(e){
    var g=e.target.closest&&e.target.closest('.piece');
    if(g&&!g.classList.contains('used')&&g!==msvg.lastElementChild)msvg.appendChild(g);
  });
  msvg.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var g=e.target.closest&&e.target.closest('.piece');
    if(!g)return;
    e.preventDefault();
    pick(+g.getAttribute('data-i'));
  });
  msvg.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var g=e.target.closest&&e.target.closest('.piece');
    if(g){e.preventDefault();pick(+g.getAttribute('data-i'))}
  });
}

/* ================= шаңырақ ================= */

    a=(i*360/N).toFixed(2);dl=(((i*17)%N)/N*.7).toFixed(2);

    um+='<g transform="rotate('+a+')"><use href="#uykP" class="uyk" style="--dl:'+dl+'s"/></g>';
  }
  var diam='',dots='',petals='';
  for(i=0;i<24;i++){

    dots+='<circle r="2.6" transform="rotate('+(i*15+7.5)+') translate(0 -225)"/>';

  var bar='<rect x="-228" y="-16" width="456" height="32" rx="9" fill="url(#woodH)" stroke="#5a2f10" stroke-width="1.5"/>'+

    [-165,-115,-65,65,115,165].map(function(x){return '<path d="M-9,0 L0,-6 L9,0 L0,6Z" transform="translate('+x+' 0)" fill="#f6d58b" stroke="#7a4419" stroke-width=".8"/>'}).join('');
  $('#sh').innerHTML=
   '<defs>'+

   '<linearGradient id="woodH" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6e3b16"/><stop offset=".3" stop-color="#c88a45"/><stop offset=".5" stop-color="#f2c880"/><stop offset=".7" stop-color="#c28040"/><stop offset="1" stop-color="#6a3813"/></linearGradient>'+
   '<radialGradient id="woodRim" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="260"><stop offset=".76" stop-color="#6d3a14"/><stop offset=".80" stop-color="#b57a3a"/><stop offset=".85" stop-color="#e7b36a"/><stop offset=".875" stop-color="#f6d493"/><stop offset=".90" stop-color="#d8a05a"/><stop offset=".94" stop-color="#a96a2c"/><stop offset=".965" stop-color="#6a3711"/></radialGradient>'+
   '<radialGradient id="woodHub"><stop offset="0" stop-color="#f6d493"/><stop offset=".6" stop-color="#c88a45"/><stop offset="1" stop-color="#7a4419"/></radialGradient>'+
   '<path id="uykS" d="M-8,-215 L-6.2,-492 Q0,-506 6.2,-492 L8,-215Z" fill="#000"/>'+
   '<g id="uykP"><path d="M-8,-215 L-6.2,-492 Q0,-506 6.2,-492 L8,-215Z" fill="url(#woodV)" stroke="#5a2f10" stroke-width=".8"/>'+
   '<rect x="-7.3" y="-323" width="14.6" height="5" fill="#f6d58b" opacity=".92"/><rect x="-6.6" y="-423" width="13.2" height="5" fill="#f6d58b" opacity=".92"/>'+
   '<path d="M-1.5,-250 L-1,-488" stroke="#fff0c8" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/></g>'+
   '</defs>'+
   '<g transform="translate(540 540)">'+
     '<g id="uykLayer"><g transform="translate(8 12)" opacity=".22">'+us+'</g>'+um+'</g>'+
     '<g id="core">'+
       '<g transform="translate(7 11)" opacity=".25"><circle r="225" fill="none" stroke="#000" stroke-width="52"/>'+
         '<rect x="-228" y="-16" width="456" height="32" rx="9" fill="#000"/><rect x="-228" y="-16" width="456" height="32" rx="9" fill="#000" transform="rotate(90)"/></g>'+
       bar+'<g transform="rotate(90)">'+bar+'</g>'+
       '<circle r="52" fill="url(#woodHub)" stroke="#5a2f10" stroke-width="2"/>'+
       '<circle r="46" fill="none" stroke="#f6d58b" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/>'+
       petals+'<circle r="9" fill="#fff0b8" stroke="#7a4419" stroke-width="1.5"/>'+

       '<circle r="251" fill="none" stroke="#4a2609" stroke-opacity=".55" stroke-width="2"/>'+

       '<path d="M-150,-182 A236,236 0 0 1 -112,-208" fill="none" stroke="#fff3c9" stroke-opacity=".9" stroke-width="2.5" stroke-linecap="round"/>'+

/* ================= логика сценария ================= */
var phase='init',locked=true,msgReady=false,remaining=TOTAL,bag=[];
function nextMsg(){if(!bag.length){bag=MSGS.slice();shuffle(bag)}return bag.pop()}

function startGreeting(){
  phase='greet';locked=true;
  greet.className='';void greet.offsetWidth;greet.classList.add('in');
  later(function(){greet.classList.remove('in');greet.classList.add('out')},GREET_MS+200);
  later(showMosaic,GREET_MS+200+1500);
}
function showMosaic(){
  phase='mosaic';
  mosaic.classList.add('show');
  later(function(){locked=false},2000);
}

function pick(i){
  if(locked||phase!=='mosaic'||used[i])return;
  locked=true;used[i]=true;remaining--;
  var g=pieces[i];
  g.classList.add('used');
  msvg.appendChild(dim);msvg.appendChild(g);
  dim.style.opacity='.62';
  g.classList.add('selected');
  var c=centers[i];
  later(function(){burst(c[0],c[1],46,230);g.classList.add('gone')},300);
  later(showMsg,550);
}
function showMsg(){
  msgText.textContent=nextMsg();
  msg.classList.add('on');
  msgReady=false;
  later(function(){msgReady=true},500);   /* нажатие принимается, когда послание уже проявилось */
}
function hideMsg(){
  if(!msgReady||!msg.classList.contains('on'))return;
  msgReady=false;
  msg.classList.remove('on');
  dim.style.opacity='0';
  if(remaining>0){locked=false}          /* следующий выбор доступен сразу, пока послание тает */
  else{later(finalScene,550)}
}

function finalScene(){
  phase='final';
  var rw=COLS*CW,rh=ROWS*CH,i;
  for(i=0;i<90;i++){
    spark(OX+Math.random()*rw,OY+Math.random()*rh,(Math.random()-.5)*120,-120-Math.random()*240,6+Math.random()*12,2+Math.random()*1.6);
  }
  mosaic.classList.add('fade');
  later(function(){finalEl.classList.add('go','on')},700);
  later(function(){burst(960,540,60,520)},6100);
  later(function(){btn.classList.add('ready')},9800);
}

function resetMosaic(){
  mosaic.classList.remove('show','fade');
  pieces.forEach(function(g,i){
    g.classList.remove('used','selected','gone');
    used[i]=false;
    msvg.insertBefore(g,dim);
  });
  dim.style.opacity='0';
  remaining=TOTAL;bag=[];
  msg.classList.remove('on');
  void mosaic.offsetWidth;
}
function restart(){
  if(phase!=='final'||!btn.classList.contains('ready'))return;
  phase='reset';locked=true;clearAll();
  btn.classList.remove('ready');
  finalEl.classList.add('leaving');finalEl.classList.remove('on');
  later(function(){
    finalEl.classList.remove('go','leaving');
    resetMosaic();
    startGreeting();
  },1000);
}
btn.addEventListener('click',restart);
/* нажатие на экран с посланием возвращает к мозаике */
msg.addEventListener('pointerdown',function(e){e.preventDefault();hideMsg()});

/* F — полноэкранный режим (для проектора / интерактивной доски) */
addEventListener('keydown',function(e){
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()}
    else if(document.exitFullscreen)document.exitFullscreen();
  }
});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ================= инициализация ================= */
var border=borderSVG();
$('#baseBorder').innerHTML=border;$('#msgBorder').innerHTML=border;$('#finalBorder').innerHTML=border;
$('#bgRing').innerHTML=ringSVG();
Array.prototype.forEach.call(document.querySelectorAll('[data-flo]'),function(el){el.innerHTML=flourishSVG()});
ambient($('#base'),28);ambient($('#msgAmb'),16);ambient($('#finalAmb'),16);
clouds($('#msgClouds'),[[-140,90,640,48,160],[1380,60,700,56,-150],[40,720,780,62,170],[1180,760,760,52,-170],[700,-20,520,44,120]]);
clouds($('#finalClouds'),[[-120,70,640,48,170],[1320,30,720,56,-160],[40,660,800,62,180],[1200,720,780,52,-180],[620,-40,520,44,130],[780,880,640,58,-140],[1560,330,520,66,-120]]);
buildMosaic();
buildShanyrak();
startGreeting();
})();
</script>
